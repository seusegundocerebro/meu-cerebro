<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04060a" />
    <title>Meu cérebro</title>
    <link rel="icon" href="icone.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="mapa.css" />
  </head>
  <body>
    <div id="palco"></div>
    <div id="overlay" aria-hidden="true"></div>
    <div id="cantos" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <header id="topo">
      <div class="marca">
        <span class="ponto"></span>
        <span class="marca-nome">CÉREBRO</span>
        <span class="marca-kit">// KIT</span>
      </div>
      <div id="contagem">carregando…</div>
      <label id="busca-caixa">
        <span aria-hidden="true">⌕</span>
        <input
          id="busca"
          type="search"
          placeholder="Achar nota…"
          autocomplete="off"
        />
      </label>
    </header>

    <nav id="legenda" aria-label="Espécies de nota"></nav>

    <form id="comando">
      <span class="prompt" aria-hidden="true">›</span>
      <input
        id="pergunta"
        type="text"
        placeholder="Pergunte ao cérebro…"
        autocomplete="off"
        enterkeyhint="send"
        aria-label="Pergunte ao cérebro"
      />
      <button id="btn-mic" type="button" title="Falar" aria-label="Falar" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" />
          <path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <button id="btn-perguntar" type="submit" title="Copiar pergunta" aria-label="Copiar pergunta">↵</button>
    </form>

    <aside id="painel" hidden>
      <button id="p-fechar" class="fechar" aria-label="Fechar">×</button>
      <div id="p-especie" class="chip"></div>
      <h1 id="p-titulo"></h1>
      <div id="p-meta"></div>
      <div id="p-aviso" class="aviso" hidden></div>
      <article id="p-leitura"></article>
      <textarea id="p-texto" spellcheck="false" hidden></textarea>
      <div class="acoes">
        <button id="p-editar">Editar</button>
        <button id="p-salvar" class="primario" hidden>Salvar</button>
        <button id="p-cancelar" hidden>Cancelar</button>
      </div>
      <h2>Ligada a</h2>
      <ul id="p-vizinhos"></ul>
      <p class="dica">Pra mexer com o Claude: <code id="p-dica"></code></p>
    </aside>

    <div id="toast" hidden></div>

    <script type="module" src="mapa.js"></script>
  </body>
</html>
